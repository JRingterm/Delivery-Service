<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toss 테스트 결제</title>
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; line-height: 1.6; }
        label { display: block; margin-top: 16px; font-weight: 700; }
        input { width: 100%; padding: 10px; box-sizing: border-box; }
        button { margin-top: 24px; padding: 12px 18px; cursor: pointer; }
        .notice { background: #f5f7fb; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<h1>Toss Payments 테스트 결제</h1>
<p class="notice">
    이 페이지는 Toss Sandbox/Test Mode 결제창을 띄우기 위한 로컬 테스트용 정적 페이지입니다.<br>
    <strong>Secret Key는 절대 브라우저에 입력하거나 노출하지 마세요.</strong>
</p>

<label for="clientKey">Toss Client Key</label>
<input id="clientKey" type="text" placeholder="test_ck_..." value="test_ck_placeholder">   <!-- value에 Toss 개발자 센터에서 발급받은 test_ck_... 값을 입력하기. -->

<label for="orderId">백엔드 주문 ID</label>
<input id="orderId" type="number" placeholder="예: 1" min="1">

<label for="amount">결제 금액</label>
<input id="amount" type="number" placeholder="예: 10000" min="1">

<label for="orderName">주문명</label>
<input id="orderName" type="text" value="배달 주문 테스트 결제">

<label for="customerName">고객명</label>
<input id="customerName" type="text" value="테스트 고객">

<button type="button" onclick="requestTossPayment()">Toss 테스트 결제창 열기</button>

<script>
    function requestTossPayment() {
        const clientKey = document.getElementById('clientKey').value.trim();
        const orderId = document.getElementById('orderId').value.trim();
        const amount = Number(document.getElementById('amount').value);
        const orderName = document.getElementById('orderName').value.trim();
        const customerName = document.getElementById('customerName').value.trim();

        if (!clientKey || !orderId || !amount || amount < 1) {
            alert('clientKey, 주문 ID, 결제 금액을 확인해 주세요.');
            return;
        }

        const tossPayments = TossPayments(clientKey);
        const pgOrderId = `ORDER-${orderId}`;
        const origin = window.location.origin;

        tossPayments.requestPayment('카드', {
            amount,
            orderId: pgOrderId,
            orderName: orderName || '배달 주문 테스트 결제',
            customerName: customerName || '테스트 고객',
            successUrl: `${origin}/success.html`,
            failUrl: `${origin}/fail.html`
        });
    }
</script>
</body>
</html>
