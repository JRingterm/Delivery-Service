<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toss 결제 승인</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 840px; margin: 40px auto; line-height: 1.6; }
        pre { background: #f5f7fb; padding: 16px; border-radius: 8px; overflow-x: auto; }
        .error { color: #c62828; }
        .success { color: #2e7d32; }
    </style>
</head>
<body>
<h1>Toss 결제 승인 처리</h1>
<p>결제창에서 전달받은 <code>paymentKey</code>, <code>orderId</code>, <code>amount</code>로 백엔드 승인 API를 호출합니다.</p>
<div id="status">승인 요청 준비 중...</div>
<pre id="result"></pre>

<script>
    async function confirmPayment() {
        // 결제 성공 시, 토스가 success.html 로 이동시키면서 success.html?paymentKey=abc123&orderId=ORDER-15&amount=12000 이런 값을 붙여준다.
        const params = new URLSearchParams(window.location.search);
        // 파라미터에서 값 추출하기.
        const paymentKey = params.get('paymentKey');
        const orderId = params.get('orderId');
        const amount = Number(params.get('amount'));
        // accessToken 읽기. 브라우저 저장소(localStorage)에서 읽어온다.
        const accessToken = localStorage.getItem('accessToken');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        if (!paymentKey || !orderId || !amount) {
            statusEl.className = 'error';
            statusEl.textContent = '필수 결제 파라미터가 없습니다.';
            resultEl.textContent = JSON.stringify({ paymentKey, orderId, amount }, null, 2);
            return;
        }

        if (!accessToken) {
            statusEl.className = 'error';
            statusEl.textContent = 'localStorage.accessToken이 없습니다. 로그인 후 accessToken을 저장해 주세요.';
            resultEl.textContent = '예: localStorage.setItem("accessToken", "JWT_ACCESS_TOKEN")';
            return;
        }

        try {
            // 승인 API 호출
            statusEl.textContent = '백엔드 승인 API 호출 중...';
            const response = await fetch('/api/payments/toss/confirm', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}`
                },
                body: JSON.stringify({ paymentKey, orderId, amount })
            });

            const text = await response.text();
            let body;
            try {
                body = text ? JSON.parse(text) : null;
            } catch (e) {
                body = text;
            }

            if (!response.ok) {
                statusEl.className = 'error';
                statusEl.textContent = `승인 실패: HTTP ${response.status}`;
                resultEl.textContent = JSON.stringify(body, null, 2);
                return;
            }

            statusEl.className = 'success';
            statusEl.textContent = '승인 성공';
            resultEl.textContent = JSON.stringify(body, null, 2);
        } catch (error) {
            statusEl.className = 'error';
            statusEl.textContent = '승인 요청 중 오류가 발생했습니다.';
            resultEl.textContent = error.stack || error.message;
        }
    }

    confirmPayment();
</script>
</body>
</html>
