spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/deliverdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create   # ??? (??? ?? ??)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt: #Spring의 ${환경변수명:기본값} 문법 사용. 환경변수가 있으면 환경변수를 사용하고, 없으면 기본값을 사용한다.
  secret: ${JWT_SECRET:change-this-jwt-secret-key-for-local-dev-only-32chars+}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000} #1시간
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000} #14일

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY:test_ck_placeholder}
    secret-key: ${TOSS_SECRET_KEY:test_sk_placeholder}